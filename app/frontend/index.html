<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sentry — the RTL-SDR controller: per-dongle naming, port assignment and live status for a Raspberry Pi SDR rack."
    />
    <meta name="color-scheme" content="dark" />
    <!-- Sentinel's page ground, so the browser chrome matches the app. -->
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
    <title>Sentry — SDR Controller</title>
  </head>
  <body>
    <!-- The app shell is static markup rather than built in JS: it never
         changes shape, and keeping it here means the header, rail and headings
         are in the document before a single module has parsed. Only the parts
         that vary — the device list, the notices, the dialogs — are built by
         `src/main.ts`, into the containers marked `data-ref` below. -->

    <a
      href="#devices-heading"
      class="sr-only-focusable fixed left-2 top-2 z-[100] rounded-rack bg-signal-accent px-4 py-3 font-sans text-[10px] font-semibold uppercase tracking-control text-ink-on-accent"
    >
      Skip to devices
    </a>

    <!-- The two live regions (architecture §9.4), written into by
         `core/liveAnnouncer.ts`. Visually hidden, always in the a11y tree. -->
    <div id="live-region-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="live-region-assertive" class="sr-only" role="alert" aria-atomic="true"></div>

    <!-- Sentinel's shell: a black bar across the top, a dark icon rail down the
         left, and the light body filling what is left. The rail sits beside the
         body rather than beneath the header so it starts below the bar, as its
         settings sidebar does.

         The shell is exactly one viewport tall and the device list scrolls
         *inside* `main`, rather than the whole page scrolling. That is how
         Sentinel's chrome behaves, and it is what keeps the rail — and the
         show/hide control at its foot — on screen: with the page scrolling as a
         whole, that control sat at the bottom of the full device list and could
         only be reached by scrolling past every card.

         `h-full` rather than `h-screen`, riding the `html, body { height: 100% }`
         chain in `styles/input.css`. `h-screen` measures the viewport directly
         and so ignores anything else in the document, which left the shell
         taller than its container and reintroduced a second, outer scrollbar. -->
    <!-- Starts hidden, and `main.ts` reveals it once the server has said
         whether this console needs a password. Without this the browser paints
         the whole console before the module script has run at all, so a
         protected Sentry showed its devices for a frame and then replaced them
         with a sign-in form. `style` rather than a class because `setVisible`
         drives `style.display`, and a class would fight it. -->
    <div
      data-ref="app-shell"
      class="flex h-full flex-col overflow-hidden bg-ground-page"
      style="display: none"
    >
      <!-- The top bar: Sentinel's `#nav` — a full-width black band, 68px tall,
           with the ⊙ mark and wordmark at the left.

           Both marks match Sentinel's `assets/logo.svg` rather than
           approximating it. That file sets "SENTINEL" in Inter 500 at -1.5%
           tracking — not Barlow, which is the app's face everywhere else — and
           converts it to paths so it needs no font at runtime. Sentry's
           wordmark has to say something different, so it stays live text and
           vendors the one Inter weight (`styles/fonts.css`).

           Sizes are derived from that artboard, not eyeballed: at the 26px mark
           height Sentinel renders, the artboard scales by 26/34.9, putting its
           22.5-unit cap height at 16.8px on screen. Inter's cap height is
           1490/2048 em, giving a 23px font size. The 8px gap is its own 11.35
           unit gap at that scale. -->
      <header
        class="flex h-[68px] shrink-0 items-center gap-2 bg-ground-header pl-[10px] pr-[22px]"
      >
        <!-- The ⊙ mark, identical to Sentinel's — a white ring with a lime
             centre dot. Proportions are ratios of its 34.90 artboard: ring
             radius 14.41, stroke 4.08, dot radius 5.69, about centre 17.4497.
             Decorative — the wordmark beside it already names the app. -->
        <!-- `-ml-px` with the header's `pl-[10px]` reproduces Sentinel's own
             pair — `#nav { padding-left: 10px }` and `#nav-logo { margin-left:
             -1px }` — rather than a value matched by eye from a screenshot. -->
        <svg
          width="26"
          height="26"
          viewBox="0 0 34.9 34.9"
          aria-hidden="true"
          focusable="false"
          class="-ml-px shrink-0"
        >
          <circle
            cx="17.449658203125"
            cy="17.449658203125"
            r="14.41"
            fill="none"
            stroke="#ffffff"
            stroke-width="4.08"
          />
          <!-- `signal.accent` (#c8ff00), the same lime Sentinel's mark uses.
               The two apps' marks are one identity rather than two drawings of
               it, which is worth more here than reserving the accent purely for
               live state. -->
          <circle cx="17.449658203125" cy="17.449658203125" r="5.69" fill="#c8ff00" />
        </svg>
        <h1
          class="m-0 font-wordmark text-[23px] font-medium uppercase leading-none tracking-wordmark text-ink-inverse"
        >
          Sentry
        </h1>
        <!-- Pushed to the far end of the bar, where Sentinel puts its settings
             control, so the two consoles put the same kind of thing in the same
             place.

             The hotspot and configuration icons that used to sit here are gone:
             both are destinations in the rail now, and an app whose navigation
             lives in two places at once teaches neither. -->
        <!-- Sentinel's `.nav-link`, field for field: 10px, 600, 0.2em tracking,
             uppercase, white, with a colour transition. `ml-auto` pushes it to
             the right of the band, where Sentinel's own nav sits.

             Hidden while the console has no password: there is no session to
             end, and an enabled control that cannot do anything is worse than
             an absent one. -->
        <button
          type="button"
          data-ref="header-sign-out"
          class="ml-auto font-sans text-[10px] font-semibold uppercase tracking-[0.2em] text-ink-inverse transition-colors hover:text-signal-accent"
          style="display: none"
        >
          Sign out
        </button>
      </header>

      <div class="flex min-h-0 flex-1 items-stretch">
        <!-- The left icon rail, matching Sentinel's settings sidebar
             (`#settings-sidebar` / `.settings-nav-item`): a 48px dark column of
             full-width 40px buttons, the active one carrying a 2px accent left
             border and a faint accent wash.

             One destination today — the SDR list — with a WiFi view planned. A
             `<nav>` with a real list rather than a row of buttons, so adding the
             second entry is a markup change and assistive tech announces "1 of
             2" when it arrives. The single button is still rendered, and still
             marked current, rather than hidden until there are two: a rail that
             appeared the day a second view landed would move every page's
             content sideways at that moment.

             Hidden with `display:none` rather than removed, because the toggle's
             `aria-controls` has to keep pointing at an element that exists. -->
        <nav
          id="nav-rail"
          data-ref="nav-rail"
          aria-label="Views"
          class="flex w-12 shrink-0 flex-col bg-ground-rail"
        >
          <ul class="m-0 flex list-none flex-col p-0">
            <li>
              <button
                type="button"
                data-ref="nav-devices"
                class="rail-tip flex h-10 w-full items-center justify-center border-l-2 border-signal-accent bg-signal-accent/[0.08] text-signal-accent transition-colors"
                aria-current="page"
                title="SDR devices"
                data-tooltip="SDR devices"
              >
                <span class="sr-only">SDR devices</span>
                <!-- A list glyph: this destination is the list of SDRs, and the
                     rail is meant to say what each view *is*. Stroke weights and
                     the 19px box match Sentinel's own rail icons so the planned
                     second entry can sit beside it without redrawing either. -->
                <svg
                  width="19"
                  height="19"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <circle cx="5" cy="6" r="1.4" fill="currentColor" stroke="none" />
                  <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none" />
                  <circle cx="5" cy="18" r="1.4" fill="currentColor" stroke="none" />
                  <line x1="10" y1="6" x2="20" y2="6" stroke-width="1.8" />
                  <line x1="10" y1="12" x2="20" y2="12" stroke-width="1.8" />
                  <line x1="10" y1="18" x2="20" y2="18" stroke-width="1.8" />
                </svg>
              </button>
            </li>
            <!-- Settings: the two instance-wide surfaces (hotspot, configuration
                 export/import), which were modals opened from header icons. A
                 gear is right here where it was wrong there — this entry does
                 lead to a settings *area*, which is exactly what did not exist
                 before. -->
            <li>
              <button
                type="button"
                data-ref="nav-settings"
                class="rail-tip flex h-10 w-full items-center justify-center border-l-2 border-transparent text-signal-muted transition-colors hover:text-ink-inverse"
                title="Settings"
                data-tooltip="Settings"
              >
                <span class="sr-only">Settings</span>
                <svg
                  width="19"
                  height="19"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="3" />
                  <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                  />
                </svg>
              </button>
            </li>
          </ul>
        </nav>

        <!-- The rail's show/hide control, matching Sentinel's footer side-panel
             button (`#map-sidebar-btn`): 36px tall, rail-width, 60% opacity,
             brightening on hover.

             It has a fill only while the rail is shown — the rail's own dark
             tone, so the button is indistinguishable from the column it sits at
             the foot of. Once the rail is hidden the fill goes with it and the
             glyph sits directly on the page canvas, which means it also has to
             invert: a white mark would disappear on that light ground, so it
             switches to `ink.primary` (4.2:1 at this opacity, clearing the 3:1
             a non-text mark needs).

             Placed here, straight after the rail, so it keeps the rail's place
             in the tab order despite being positioned — and so it outlives the
             thing it hides, which would otherwise take the button with it and
             leave no way back. -->
        <button
          type="button"
          data-ref="nav-rail-toggle"
          class="fixed bottom-0 left-0 z-20 flex h-9 w-12 shrink-0 items-center justify-center bg-ground-rail text-ink-inverse opacity-60 transition-opacity hover:opacity-100 md:hidden"
          aria-expanded="true"
          aria-controls="nav-rail"
          aria-label="Hide sidebar"
          title="Hide sidebar"
        >
          <!-- Sentinel's panel mark — a rounded rectangle with a rule down its
               left — at the same 14px and 1.1 stroke, so the two apps' toggles
               are the same control rather than two drawings of one idea. -->
          <svg
            width="14"
            height="14"
            viewBox="0 0 15 15"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <rect
              x="1.5"
              y="1.5"
              width="12"
              height="12"
              rx="1"
              stroke="currentColor"
              stroke-width="1.1"
            />
            <line x1="5.5" y1="1.5" x2="5.5" y2="13.5" stroke="currentColor" stroke-width="1.1" />
          </svg>
        </button>

        <main class="min-w-0 flex-1 overflow-y-auto">
          <div class="flex min-h-full flex-col">
            <!-- Sentinel's settings body gutters. No section heading above the
                 card: this console has one subject, so a title naming it would
                 only repeat the card beneath. -->
            <!-- One gutter wrapper, two destinations inside it. Only one is
                 visible at a time; `main.ts` swaps them and moves focus to the
                 new one's heading, because a keyboard user who activates a rail
                 button would otherwise be left with focus on the rail and no
                 signal that the page changed. -->
            <div class="flex w-full max-w-content flex-col gap-6 px-5 pb-16 pt-[34px] md:px-gutter">
              <!-- `gap-4`, matching the card-to-card gap inside the list below:
                   the warning and the notices are part of the same vertical
                   stack as the device boxes, and a wider gap above the first
                   card made them read as a separate region floating above it. -->
              <div data-ref="devices-view" class="flex flex-col gap-4">
                <!-- `contents` on both: these wrappers exist so `main.ts` and
                     `sdrsView` have something stable to mount into, but an empty
                     one is still a flex item and still earns a `gap-6` from the
                     column above. With three such wrappers that produced 72px of
                     dead space above the first card when nothing was showing.
                     `display: contents` promotes the mounted child to be the
                     flex item instead, so a hidden child contributes no gap. -->
                <div data-ref="unprotected-warning" class="contents"></div>
                <div data-ref="notice-list" class="contents"></div>
                <ul
                  data-ref="serial-conflicts"
                  class="m-0 flex list-none flex-col gap-2 p-0"
                  aria-label="Serial conflicts"
                  hidden
                ></ul>
                <!-- Each device is its own white box on the canvas — no wrapping
                   card and no title above them. The heading stays in the DOM,
                   screen-reader only: it is the skip link's destination and this
                   section's accessible name, and the boxes below would otherwise
                   be an unlabelled run. -->
                <section aria-labelledby="devices-heading" class="flex flex-col gap-4">
                  <!-- Visible now, and the page's own title rather than a
                       caption on the first box: the boxes below carry their own
                       headings, and this names the destination the rail
                       switched to. Still the skip link's target and this
                       section's accessible name. -->
                  <h2
                    id="devices-heading"
                    data-ref="devices-heading-anchor"
                    tabindex="-1"
                    class="m-0 flex items-center gap-3 font-condensed text-[21px] font-semibold uppercase leading-tight tracking-[0.16em] text-ink-primary outline-none"
                  >
                    <span
                      aria-hidden="true"
                      class="h-1.5 w-1.5 shrink-0 rounded-full bg-signal-accent"
                    ></span>
                    SDR devices
                  </h2>
                  <div data-ref="device-list" class="flex flex-col gap-4"></div>
                </section>
              </div>

              <!-- The Settings destination. Its heading is screen-reader only,
                   as the devices view's is: each section below carries its own
                   visible heading, so a second one above them only repeated
                   what the rail already said. It stays in the DOM because it is
                   this view's accessible name and the element navigation moves
                   focus to on arrival — deleting it would break both. -->
              <!-- On the page canvas, not a surface of its own: each section below is
                   its own white card (matching the device cards in the other
                   view), and a white panel behind white cards would erase the
                   edges that separate them. -->
              <div data-ref="settings-view" class="flex flex-col gap-6" hidden>
                <h2
                  id="settings-heading"
                  data-ref="settings-heading-anchor"
                  tabindex="-1"
                  class="m-0 flex items-center gap-3 font-condensed text-[21px] font-semibold uppercase leading-tight tracking-[0.16em] text-ink-primary outline-none"
                >
                  <span
                    aria-hidden="true"
                    class="h-1.5 w-1.5 shrink-0 rounded-full bg-signal-accent"
                  ></span>
                  Settings
                </h2>
                <div data-ref="console-password-panel"></div>
                <div data-ref="hotspot-panel"></div>
                <div data-ref="config-panel"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- The sign-in screen, which replaces the shell entirely when a password is
         set and this browser has no session. -->
    <div data-ref="sign-in-root"></div>

    <!-- Dialogs and the auth prompt mount here, outside the shell's
         `overflow-hidden`, which is what `<Teleport to="body">` used to buy. -->
    <div data-ref="overlay-root"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
