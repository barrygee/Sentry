# Sentry — multi-dongle RTL-SDR controller.
#
# ONE service replaces the legacy two-service stack. Sentry supervises a pair of
# child processes (`rtl_tcp` + the vendored relay) per enabled dongle inside this
# container, so per-dongle containers and the Docker socket are both gone
# (ADR-0001, ADR-0002).

services:
  sentry:
    build: .
    container_name: sentry
    restart: unless-stopped

    # Required for USB access to the dongles. This grants broad host device
    # access; it is the same posture the legacy stack ran under, and the reason
    # the image deliberately runs as root (see the Dockerfile's note).
    privileged: true

    # Authorises the whole USB char-major for this container. Pairs with the
    # /dev/bus/usb bind mount under `volumes:` below — the mount makes the nodes
    # visible, this rule makes them openable, and `*` covers every minor so a
    # re-enumerated dongle stays authorised without a restart.
    device_cgroup_rules:
      - 'c 189:* rmw' # 189 = USB char-major; the whole bus, not one node

    # Host networking is required, not merely convenient: each dongle's IQ port
    # (P) and NDJSON control port (P+2) are assigned by the operator at runtime,
    # so the published set is dynamic and cannot be declared statically here.
    # It also avoids the bridge/NAT DNAT path that proved unreliable for the
    # legacy stack.
    network_mode: host

    volumes:
      # The WHOLE USB bus, as a bind mount — which must NOT go back to being a
      # `devices:` entry. `devices:` pointed at a DIRECTORY is the form that
      # snapshots: Docker walks /dev/bus/usb and expands it into a list of
      # individual device nodes in the container's OCI spec, fixed at container
      # start. When a dongle re-enumerates (device 14 -> 15, confirmed on this
      # hardware) the host gains a node the container never sees, so libusb —
      # which still enumerates the device through the visible /sys — counts it
      # and then fails to open it. librtlsdr reads empty USB strings and Sentry
      # correctly diagnoses `unresponsive_device`, until `docker compose
      # restart` regenerates the device list. A replug must not need a restart.
      #
      # A bind mount of a devtmpfs DIRECTORY is the same directory, so nodes
      # created after container start appear live. `device_cgroup_rules` above
      # is what grants access to them.
      - /dev/bus/usb:/dev/bus/usb

      # Device names, port assignments and tuning defaults live in SQLite here.
      # A named volume (not an anonymous one) so configuration survives
      # `docker compose down` and container recreation — requirement 7 is
      # persistence across reboots, and losing it on a rebuild would fail that.
      - sentry-data:/data

      # WiFi hotspot control (ADR-0007). `nmcli` in this container drives the
      # HOST's NetworkManager over its system D-Bus socket; without this mount
      # there is nothing for it to talk to and GET /api/hotspot simply reports
      # available: false.
      #
      # Read-write deliberately. `:ro` on a *socket* restricts nothing about
      # the calls made through it — the same reasoning ADR-0002 applied when it
      # rejected mounting the Docker socket read-only as security theatre. The
      # real controls are elsewhere: SENTRY_HOTSPOT_CONTROL_ENABLED below is off
      # by default, and every hotspot change is refused while SENTRY_AUTH_TOKEN
      # is unset.
      #
      # Absent on a host that does not run NetworkManager (Raspberry Pi OS
      # Bookworm does, by default), in which case Docker creates an empty
      # directory here and the hotspot degrades to read-only rather than
      # failing.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

      # NetworkManager's dnsmasq lease files — the source for
      # GET /api/hotspot/clients. Read-only: this is the one hotspot path that
      # only ever reads. A missing path yields `clients: null`, which the UI
      # renders as "cannot tell" rather than "nobody connected".
      - /var/lib/NetworkManager:/var/lib/NetworkManager:ro

    # Gives `SENTRY_AUTH_TOKEN` (and any other secret) a git-ignored home:
    # a real deployment sets it in a project-root `.env` (see `.env.example`)
    # rather than committing it into this file's `environment:` block below,
    # which stays for the non-secret, deployment-relevant defaults.
    # `required: false` so a fresh checkout without a `.env` yet (auth simply
    # stays off, the documented default) still runs `docker compose up`.
    env_file:
      - path: .env
        required: false

    environment:
      # Full reference: .env.example / docs/architecture §3.4. Defaults live in
      # app/backend/config.py; only the deployment-relevant ones are set here.
      SENTRY_HTTP_HOST: '0.0.0.0'
      SENTRY_HTTP_PORT: '8000'
      SENTRY_DATABASE_URL: 'sqlite+aiosqlite:////data/sentry.db'
      SENTRY_MAX_DEVICES: '8'
      SENTRY_LOG_LEVEL: 'INFO'
      # Auth is OFF unless a token is set — appropriate only on a trusted LAN.
      # Uncomment and set a long random value to require a bearer token on every
      # /api/** route except /api/health.
      # SENTRY_AUTH_TOKEN: 'replace-with-a-long-random-value'
      #
      # Set only if Sentry sits behind NAT/a proxy and the Host header would
      # otherwise advertise the wrong address to Sentinel in GET /api/v1/sdrs.
      # Note it is published to hotspot-joined clients too, who cannot reach a
      # LAN address — read the hotspot's own address off the hotspot panel.
      # SENTRY_ADVERTISED_HOST: '192.168.1.45'

      # Lets the web UI reconfigure this HOST's WiFi so Sentry can run its own
      # network for Sentinel clients (ADR-0007). OFF by default: this is the one
      # setting that hands a LAN-facing API control of host networking. With it
      # on, every hotspot change is still refused until SENTRY_AUTH_TOKEN is set,
      # because an access point puts anyone in radio range holding the passphrase
      # on the same segment as this API.
      SENTRY_HOTSPOT_CONTROL_ENABLED: 'false'

    healthcheck:
      # /api/health stays 200 while individual dongles are degraded and returns
      # 503 only when the database is unreachable — a wedged dongle must never
      # restart the container and take the healthy dongles down with it.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status < 500 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sentry-data:
